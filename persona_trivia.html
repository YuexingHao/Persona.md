<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compete With Your Persona</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --ink: #18202a;
      --muted: #566273;
      --line: #d7deea;
      --accent: #0d6efd;
      --accent-soft: #e9f1ff;
      --good: #0a7f49;
      --bad: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #f1f5ff 0%, var(--bg) 35%, var(--bg) 100%);
      color: var(--ink);
      font-family: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 20px 16px 56px;
    }
    .hero, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 22px rgba(12, 25, 48, 0.06);
    }
    .hero { padding: 18px; }
    h1 {
      margin: 0;
      font-size: 1.58rem;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }
    .sub {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .meta {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      background: #fafcff;
    }
    .panel {
      margin-top: 14px;
      padding: 14px;
    }
    .q {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fcfdff;
    }
    .q + .q { margin-top: 10px; }
    .qhead {
      font-weight: 600;
      font-size: 0.97rem;
      margin-bottom: 8px;
    }
    .opts {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr;
    }
    label.opt {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 10px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      cursor: pointer;
      transition: border-color 120ms ease, background 120ms ease;
      background: #fff;
    }
    label.opt:hover {
      border-color: #b7c7ea;
      background: #f7faff;
    }
    input[type="radio"] { margin-top: 2px; }
    .controls {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    button {
      border: 1px solid #0c58cf;
      background: var(--accent);
      color: #fff;
      border-radius: 10px;
      padding: 9px 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #fff;
      color: var(--ink);
      border-color: var(--line);
    }
    .status { color: var(--muted); font-size: 0.92rem; }
    .reveal {
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 10px;
      background: var(--accent-soft);
      display: none;
      font-size: 0.92rem;
    }
    .reveal strong { font-weight: 700; }
    .result {
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      padding: 12px;
      display: none;
    }
    .scoreboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .box {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 10px;
      background: #fbfcff;
    }
    .box .k { font-size: 0.78rem; color: var(--muted); }
    .box .v { font-size: 1.05rem; font-weight: 700; }
    .win { color: var(--good); }
    .lose { color: var(--bad); }
    .detail {
      margin-top: 10px;
      max-height: 280px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      background: #fcfdff;
      font-size: 0.9rem;
    }
    .detail .row + .row { margin-top: 6px; }
    a { color: var(--accent); }
    @media (min-width: 760px) {
      .opts { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>Compete With Your Persona</h1>
      <div class="sub">15 binary trivia questions generated from <code>Persona.md</code>. You answer. Persona-agent answers from profile rules. Highest score wins.</div>
      <div class="meta">
        <span class="pill">questions: 15</span>
        <span class="pill">options each: 2</span>
        <span class="pill">source: persona/Persona.md</span>
      </div>
    </section>

    <section class="panel">
      <form id="quiz"></form>
      <div id="reveal" class="reveal"></div>
      <div class="controls">
        <button id="prevBtn" class="secondary" type="button">Previous</button>
        <button id="nextBtn" type="button">Next Question</button>
        <button id="resetBtn" class="secondary" type="button">Reset</button>
        <span id="status" class="status"></span>
      </div>
      <div id="result" class="result"></div>
    </section>

    <p class="sub" style="margin-top:10px;">
      Back to <a href="./index.html">Persona Index</a>
    </p>
  </main>

  <script>
    const QUESTIONS = [
      { q: "For a straightforward request, what is preferred?", o: ["Execute directly", "Discuss at length first"], key: 0, persona: 0, why: "Persona notes direct execution over discussion." },
      { q: "When data integrity is involved, what matters more?", o: ["Explicit double-checking", "Fast approximate output"], key: 0, persona: 0, why: "Persona repeatedly prioritizes explicit validation." },
      { q: "Preferred status update format?", o: ["Compact bullets with IDs and reasons", "Long narrative paragraph"], key: 0, persona: 0, why: "Status rule says compact list with ID -> state -> reason." },
      { q: "How should artifact naming be handled?", o: ["Deterministic date/version anchors", "Ad-hoc names"], key: 0, persona: 0, why: "Persona emphasizes deterministic naming and traceability." },
      { q: "Decision style under pressure?", o: ["Accuracy first, then speed", "Speed first, then accuracy"], key: 0, persona: 0, why: "Working style states accuracy first, then speed." },
      { q: "If a mismatch appears, what next?", o: ["Investigate root cause", "Ignore if output mostly looks fine"], key: 0, persona: 0, why: "Non-negotiable: investigate mismatch root cause before finalize." },
      { q: "For derivative datasets, schema approach?", o: ["Preserve schema consistency", "Change columns as convenient"], key: 0, persona: 0, why: "Persona requires schema consistency for derivatives." },
      { q: "When request is ambiguous, default behavior?", o: ["Safe default + explicit assumptions", "Wait indefinitely for clarification"], key: 0, persona: 0, why: "Personalization rule: safe default and report assumptions." },
      { q: "Acceptance criterion for data tasks?", o: ["Exact-match checks + explicit confirmation", "Single quick spot-check"], key: 0, persona: 0, why: "Acceptance pattern calls for exact-match confirmation." },
      { q: "Preferred collaboration tone?", o: ["Minimal fluff, high signal", "Verbose motivational style"], key: 0, persona: 0, why: "Persona collaboration style is concise and high signal." },
      { q: "Queue monitoring detail level?", o: ["Include reason tags like Priority/Resources", "Only report pending/running"], key: 0, persona: 0, why: "Persona asks to include pending reasons like Priority/Resources." },
      { q: "What should data-task reports include?", o: ["Join key, row counts, mismatches, affected IDs", "Only final output path"], key: 0, persona: 0, why: "Personalization rule defines those exact report fields." },
      { q: "Most aligned domain focus?", o: ["Dataset curation and label QC", "Experimental visual theming"], key: 0, persona: 0, why: "Domain priorities center on dataset curation and quality control." },
      { q: "Model workflow preference?", o: ["Comparative pipelines across model families", "Single model only"], key: 0, persona: 0, why: "Persona focuses on cross-model comparative pipelines." },
      { q: "If explanation seems wrong, likely follow-up?", o: ["Request correction quickly", "Postpone correction"], key: 0, persona: 0, why: "Interaction pattern shows immediate correction requests." }
    ];

    // Persona-agent predicts the user's likely answer from Persona.md signals.
    const AGENT = QUESTIONS.map(q => q.persona);

    const quiz = document.getElementById("quiz");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const revealEl = document.getElementById("reveal");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const userAnswers = Array(QUESTIONS.length).fill(null);
    let current = 0;

    function render() {
      const item = QUESTIONS[current];
      quiz.innerHTML = "";
      const block = document.createElement("div");
      block.className = "q";
      block.innerHTML = `
        <div class="qhead">Q${current + 1}. ${item.q}</div>
        <div class="opts">
          <label class="opt"><input type="radio" name="current-q" value="0"> <span>${item.o[0]}</span></label>
          <label class="opt"><input type="radio" name="current-q" value="1"> <span>${item.o[1]}</span></label>
        </div>
      `;
      quiz.appendChild(block);

      const saved = userAnswers[current];
      if (saved !== null) {
        const chosen = quiz.querySelector(`input[name="current-q"][value="${saved}"]`);
        if (chosen) chosen.checked = true;
      }

      quiz.querySelectorAll('input[name="current-q"]').forEach(el => {
        el.addEventListener("change", () => {
          userAnswers[current] = Number(el.value);
          statusEl.textContent = `Question ${current + 1}/${QUESTIONS.length}`;
          showReveal();
        });
      });

      prevBtn.disabled = current === 0;
      nextBtn.textContent = current === QUESTIONS.length - 1 ? "Finish Duel" : "Next Question";
      statusEl.textContent = `Question ${current + 1}/${QUESTIONS.length}`;
      resultEl.style.display = "none";
      resultEl.innerHTML = "";
      revealEl.style.display = "none";
      revealEl.innerHTML = "";
    }

    function showReveal() {
      if (userAnswers[current] === null) return;
      const item = QUESTIONS[current];
      const pred = AGENT[current];
      const match = userAnswers[current] === pred;
      revealEl.innerHTML = `
        <strong>Persona.md predicts:</strong> ${item.o[pred]}<br>
        <strong>Rationale:</strong> ${item.why}<br>
        <strong>Match with your answer:</strong> ${match ? "Yes" : "No"}
      `;
      revealEl.style.display = "block";
    }

    function allAnswered() {
      return userAnswers.every(v => v !== null);
    }

    function duel() {
      if (!allAnswered()) {
        statusEl.textContent = "Please answer all 15 questions before finishing.";
        return;
      }

      const key = QUESTIONS.map(q => q.key);
      let userScore = 0;
      let agentPredictScore = 0;
      let agentConsistency = 0;

      for (let i = 0; i < QUESTIONS.length; i += 1) {
        if (userAnswers[i] === key[i]) userScore += 1;
        if (userAnswers[i] === AGENT[i]) agentPredictScore += 1;
        if (AGENT[i] === key[i]) agentConsistency += 1;
      }

      let winner = "Tie";
      let cls = "";
      if (userScore > agentPredictScore) { winner = "User Wins"; cls = "win"; }
      else if (userScore < agentPredictScore) { winner = "Persona Agent Wins"; cls = "lose"; }

      const rows = QUESTIONS.map((q, i) => {
        const u = q.o[userAnswers[i]];
        const a = q.o[AGENT[i]];
        const okU = userAnswers[i] === q.key ? "✓" : "✗";
        const okA = AGENT[i] === userAnswers[i] ? "✓" : "✗";
        return `<div class=\"row\">Q${i + 1}: User ${okU} (${u}) | Persona Prediction ${okA} (${a})</div>`;
      }).join("");

      resultEl.innerHTML = `
        <div><strong class="${cls}">${winner}</strong></div>
        <div class="scoreboard">
          <div class="box"><div class="k">User Persona-Consistency</div><div class="v">${userScore}/15</div></div>
          <div class="box"><div class="k">Persona Prediction Accuracy</div><div class="v">${agentPredictScore}/15</div></div>
          <div class="box"><div class="k">Persona Rule-Consistency</div><div class="v">${agentConsistency}/15</div></div>
        </div>
        <div class="detail">${rows}</div>
      `;
      resultEl.style.display = "block";
      statusEl.textContent = "Duel complete.";
    }

    nextBtn.addEventListener("click", () => {
      if (userAnswers[current] === null) {
        statusEl.textContent = `Please pick one option for Question ${current + 1}.`;
        return;
      }
      if (current === QUESTIONS.length - 1) {
        duel();
        return;
      }
      current += 1;
      render();
    });

    prevBtn.addEventListener("click", () => {
      if (current === 0) return;
      current -= 1;
      render();
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      current = 0;
      for (let i = 0; i < userAnswers.length; i += 1) userAnswers[i] = null;
      render();
    });

    render();
  </script>
</body>
</html>
