<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compete With Your Persona</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --ink: #18202a;
      --muted: #566273;
      --line: #d7deea;
      --accent: #0d6efd;
      --accent-soft: #e9f1ff;
      --good: #0a7f49;
      --bad: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #f1f5ff 0%, var(--bg) 35%, var(--bg) 100%);
      color: var(--ink);
      font-family: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 20px 16px 56px;
    }
    .hero, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 22px rgba(12, 25, 48, 0.06);
    }
    .hero { padding: 18px; }
    h1 {
      margin: 0;
      font-size: 1.58rem;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }
    .sub {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .meta {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      background: #fafcff;
    }
    .panel {
      margin-top: 14px;
      padding: 14px;
    }
    .q {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fcfdff;
    }
    .q + .q { margin-top: 10px; }
    .qhead {
      font-weight: 600;
      font-size: 0.97rem;
      margin-bottom: 8px;
    }
    .opts {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr;
    }
    label.opt {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 10px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      cursor: pointer;
      transition: border-color 120ms ease, background 120ms ease;
      background: #fff;
    }
    label.opt:hover {
      border-color: #b7c7ea;
      background: #f7faff;
    }
    input[type="radio"] { margin-top: 2px; }
    .controls {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    button {
      border: 1px solid #0c58cf;
      background: var(--accent);
      color: #fff;
      border-radius: 10px;
      padding: 9px 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #fff;
      color: var(--ink);
      border-color: var(--line);
    }
    .status { color: var(--muted); font-size: 0.92rem; }
    .reveal {
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 10px;
      background: var(--accent-soft);
      display: none;
      font-size: 0.92rem;
    }
    .reveal strong { font-weight: 700; }
    .result {
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      padding: 12px;
      display: none;
    }
    .scoreboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .box {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 10px;
      background: #fbfcff;
    }
    .box .k { font-size: 0.78rem; color: var(--muted); }
    .box .v { font-size: 1.05rem; font-weight: 700; }
    .win { color: var(--good); }
    .lose { color: var(--bad); }
    .detail {
      margin-top: 10px;
      max-height: 280px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      background: #fcfdff;
      font-size: 0.9rem;
    }
    .detail .row + .row { margin-top: 6px; }
    .update-box {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: #fbfcff;
      display: none;
    }
    .update-box h3 {
      margin: 0 0 8px;
      font-size: 0.98rem;
    }
    .update-box textarea {
      width: 100%;
      min-height: 180px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px;
      font-family: "IBM Plex Mono", Menlo, Consolas, monospace;
      font-size: 0.82rem;
      line-height: 1.45;
      resize: vertical;
      background: #fff;
      color: var(--ink);
    }
    .update-actions {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    a { color: var(--accent); }
    @media (min-width: 760px) {
      .opts { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>Compete With Your Persona</h1>
      <div class="sub">15 binary trivia questions generated from <code>Persona.md</code>. You answer. Persona-agent answers from profile rules. Highest score wins.</div>
      <div class="meta">
        <span class="pill">questions: 15</span>
        <span class="pill">options each: 2</span>
        <span class="pill">source: persona/Persona.md</span>
      </div>
    </section>

    <section class="panel">
      <form id="quiz"></form>
      <div id="reveal" class="reveal"></div>
      <div class="controls">
        <button id="prevBtn" class="secondary" type="button">Previous</button>
        <button id="nextBtn" type="button">Next Question</button>
        <button id="resetBtn" class="secondary" type="button">Reset</button>
        <span id="status" class="status"></span>
      </div>
      <div id="result" class="result"></div>
      <div id="updateBox" class="update-box">
        <h3>Suggested Persona.md Update (from your answers)</h3>
        <textarea id="updateText" readonly></textarea>
        <div class="update-actions">
          <button id="copyUpdateBtn" type="button">Copy Update Text</button>
          <button id="downloadUpdateBtn" class="secondary" type="button">Download .md</button>
        </div>
      </div>
    </section>

    <p class="sub" style="margin-top:10px;">
      Back to <a href="./index.html">Persona Index</a>
    </p>
  </main>

  <script>
    const QUESTIONS = [
      { q: "You have ten minutes before a meeting, and someone asks for a quick fix that seems straightforward. Which response feels more like your natural style when deciding what to do first?", o: ["Implement right away and show concrete progress", "Pause and discuss every design angle before touching anything"], key: 0, persona: 0, why: "Persona indicates direct execution over extended upfront discussion." },
      { q: "A result looks good at first glance, but this output will be used in downstream experiments. Under that pressure, what feels more like your default instinct?", o: ["Double-check key fields explicitly before calling it done", "Ship fast and assume small issues can be cleaned up later"], key: 0, persona: 0, why: "Persona strongly favors explicit validation when integrity matters." },
      { q: "You are sending a status update to collaborators who are juggling many tasks. Which style better matches how you usually communicate updates?", o: ["Compact bullets with IDs, states, and reasons", "A long narrative that explains everything in one block"], key: 0, persona: 0, why: "Persona prefers concise status reports with concrete identifiers." },
      { q: "You are naming a new artifact that will be revisited in a month. Which naming style sounds most consistent with your normal habits?", o: ["Deterministic names with date/version anchors", "Whatever name feels convenient in the moment"], key: 0, persona: 0, why: "Persona emphasizes deterministic and traceable naming conventions." },
      { q: "A deadline is close and you need to make a judgment call. Which priority order sounds most like you in practice?", o: ["Protect correctness first, then optimize speed", "Move fastest first, then revisit correctness only if needed"], key: 0, persona: 0, why: "Persona states an accuracy-first decision style." },
      { q: "During a merge step, you discover a mismatch that could affect conclusions. What is more representative of your default behavior?", o: ["Investigate root cause before finalizing", "Accept the mismatch if most rows still look plausible"], key: 0, persona: 0, why: "Persona lists root-cause investigation as non-negotiable." },
      { q: "You are creating a derivative dataset from a trusted reference file. Which choice is most aligned with your normal quality bar?", o: ["Preserve schema consistency unless there is a clear reason to change", "Adjust schema freely as long as the file still loads"], key: 0, persona: 0, why: "Persona explicitly prioritizes schema consistency in derivatives." },
      { q: "A request is slightly ambiguous and you do not want to stall momentum. Which action best matches your collaboration style?", o: ["Proceed with a safe default and clearly state assumptions", "Wait without action until every detail is clarified"], key: 0, persona: 0, why: "Persona rule says proceed safely and make assumptions explicit." },
      { q: "Someone asks whether a data task is truly complete. What evidence format sounds most like what you would provide?", o: ["Exact-match checks plus explicit confirmation", "A quick spot-check and a confidence statement"], key: 0, persona: 0, why: "Persona acceptance pattern requires exact-match confirmation." },
      { q: "In collaborative work, what communication tone feels closest to your actual preference over time?", o: ["High-signal, minimal-fluff task communication", "Long motivational style with broad framing"], key: 0, persona: 0, why: "Persona describes a concise, task-focused communication style." },
      { q: "You are monitoring queued jobs and someone asks for an update. Which answer shape feels most like your normal reporting behavior?", o: ["Include pending reasons such as Priority or Resources", "Only report whether jobs are pending or running"], key: 0, persona: 0, why: "Persona asks for reason-level visibility in queue status." },
      { q: "A teammate asks for a final report on a data transformation. Which level of detail best fits your default standards?", o: ["Include join keys, row counts, mismatch totals, and affected IDs", "Share only output location and high-level summary"], key: 0, persona: 0, why: "Persona defines these concrete metrics as required report content." },
      { q: "If you had to pick one area that best describes your practical focus in this workspace, which one feels most accurate?", o: ["Dataset curation and label quality control", "Visual polish experiments and interface aesthetics"], key: 0, persona: 0, why: "Persona domain priorities emphasize dataset and label quality work." },
      { q: "When evaluating model outputs, which workflow feels closest to your long-term pattern?", o: ["Compare behavior across multiple model families", "Stick to a single model and rarely benchmark alternatives"], key: 0, persona: 0, why: "Persona highlights comparative model pipelines as a recurring priority." },
      { q: "An assistant explanation sounds slightly off and could mislead next steps. What is most consistent with your observed follow-up pattern?", o: ["Request correction quickly and tighten the answer", "Postpone correction and move on to another task"], key: 0, persona: 0, why: "Persona interaction history shows immediate correction requests." }
    ];

    // Persona-agent predicts the user's likely answer from Persona.md signals.
    const AGENT = QUESTIONS.map(q => q.persona);

    const quiz = document.getElementById("quiz");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const revealEl = document.getElementById("reveal");
    const updateBoxEl = document.getElementById("updateBox");
    const updateTextEl = document.getElementById("updateText");
    const copyUpdateBtn = document.getElementById("copyUpdateBtn");
    const downloadUpdateBtn = document.getElementById("downloadUpdateBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const userAnswers = Array(QUESTIONS.length).fill(null);
    let current = 0;

    function render() {
      const item = QUESTIONS[current];
      quiz.innerHTML = "";
      const block = document.createElement("div");
      block.className = "q";
      block.innerHTML = `
        <div class="qhead">Q${current + 1}. ${item.q}</div>
        <div class="opts">
          <label class="opt"><input type="radio" name="current-q" value="0"> <span>${item.o[0]}</span></label>
          <label class="opt"><input type="radio" name="current-q" value="1"> <span>${item.o[1]}</span></label>
        </div>
      `;
      quiz.appendChild(block);

      const saved = userAnswers[current];
      if (saved !== null) {
        const chosen = quiz.querySelector(`input[name="current-q"][value="${saved}"]`);
        if (chosen) chosen.checked = true;
      }

      quiz.querySelectorAll('input[name="current-q"]').forEach(el => {
        el.addEventListener("change", () => {
          userAnswers[current] = Number(el.value);
          statusEl.textContent = `Question ${current + 1}/${QUESTIONS.length}`;
          showReveal();
        });
      });

      prevBtn.disabled = current === 0;
      nextBtn.textContent = current === QUESTIONS.length - 1 ? "Finish Duel" : "Next Question";
      statusEl.textContent = `Question ${current + 1}/${QUESTIONS.length}`;
      resultEl.style.display = "none";
      resultEl.innerHTML = "";
      revealEl.style.display = "none";
      revealEl.innerHTML = "";
      updateBoxEl.style.display = "none";
      updateTextEl.value = "";
    }

    function showReveal() {
      if (userAnswers[current] === null) return;
      const item = QUESTIONS[current];
      const pred = AGENT[current];
      const match = userAnswers[current] === pred;
      revealEl.innerHTML = `
        <strong>Persona.md predicts:</strong> ${item.o[pred]}<br>
        <strong>Rationale:</strong> ${item.why}<br>
        <strong>Match with your answer:</strong> ${match ? "Yes" : "No"}
      `;
      revealEl.style.display = "block";
    }

    function allAnswered() {
      return userAnswers.every(v => v !== null);
    }

    function buildPersonaUpdateText(agentPredictScore, userScore) {
      const total = QUESTIONS.length;
      const mismatches = [];
      const matches = [];
      for (let i = 0; i < total; i += 1) {
        const row = {
          idx: i + 1,
          q: QUESTIONS[i].q,
          user: QUESTIONS[i].o[userAnswers[i]],
          persona: QUESTIONS[i].o[AGENT[i]],
          why: QUESTIONS[i].why
        };
        if (userAnswers[i] === AGENT[i]) matches.push(row);
        else mismatches.push(row);
      }

      const lines = [];
      lines.push("# Persona Update Proposal (Generated from Trivia Answers)");
      lines.push("");
      lines.push(`Date: ${new Date().toISOString().slice(0, 10)}`);
      lines.push(`Prediction accuracy: ${agentPredictScore}/${total}`);
      lines.push(`User persona-consistency score: ${userScore}/${total}`);
      lines.push("");
      lines.push("## Suggested Changes");
      if (mismatches.length === 0) {
        lines.push("- No preference conflicts detected in this run.");
        lines.push("- Keep current Persona.md stable; add this session as confirming evidence.");
      } else {
        lines.push("- Add or refine preference statements based on mismatch scenarios below.");
      }
      lines.push("");
      lines.push("## Mismatch Signals (High Priority for Review)");
      if (mismatches.length === 0) {
        lines.push("- None.");
      } else {
        mismatches.forEach(m => {
          lines.push(`- Q${m.idx}: ${m.q}`);
          lines.push(`  - Persona predicted: ${m.persona}`);
          lines.push(`  - User selected: ${m.user}`);
          lines.push(`  - Existing rationale: ${m.why}`);
        });
      }
      lines.push("");
      lines.push("## Alignment Signals (Can reinforce existing Persona.md)");
      if (matches.length === 0) {
        lines.push("- None.");
      } else {
        matches.slice(0, 8).forEach(m => {
          lines.push(`- Q${m.idx}: matched on \"${m.user}\"`);
        });
      }
      lines.push("");
      lines.push("## Suggested Changelog Entry");
      lines.push(`- ${new Date().toISOString().slice(0, 10)}: Updated preferences using persona trivia response profile (${agentPredictScore}/${total} prediction match).`);
      return lines.join("\\n");
    }

    function duel() {
      if (!allAnswered()) {
        statusEl.textContent = "Please answer all 15 questions before finishing.";
        return;
      }

      const key = QUESTIONS.map(q => q.key);
      let userScore = 0;
      let agentPredictScore = 0;
      let agentConsistency = 0;

      for (let i = 0; i < QUESTIONS.length; i += 1) {
        if (userAnswers[i] === key[i]) userScore += 1;
        if (userAnswers[i] === AGENT[i]) agentPredictScore += 1;
        if (AGENT[i] === key[i]) agentConsistency += 1;
      }

      let winner = "Tie";
      let cls = "";
      if (userScore > agentPredictScore) { winner = "User Wins"; cls = "win"; }
      else if (userScore < agentPredictScore) { winner = "Persona Agent Wins"; cls = "lose"; }

      const rows = QUESTIONS.map((q, i) => {
        const u = q.o[userAnswers[i]];
        const a = q.o[AGENT[i]];
        const okU = userAnswers[i] === q.key ? "✓" : "✗";
        const okA = AGENT[i] === userAnswers[i] ? "✓" : "✗";
        return `<div class=\"row\">Q${i + 1}: User ${okU} (${u}) | Persona Prediction ${okA} (${a})</div>`;
      }).join("");

      resultEl.innerHTML = `
        <div><strong class="${cls}">${winner}</strong></div>
        <div class="scoreboard">
          <div class="box"><div class="k">User Persona-Consistency</div><div class="v">${userScore}/15</div></div>
          <div class="box"><div class="k">Persona Prediction Accuracy</div><div class="v">${agentPredictScore}/15</div></div>
          <div class="box"><div class="k">Persona Rule-Consistency</div><div class="v">${agentConsistency}/15</div></div>
        </div>
        <div class="detail">${rows}</div>
      `;
      resultEl.style.display = "block";
      statusEl.textContent = "Duel complete.";

      updateTextEl.value = buildPersonaUpdateText(agentPredictScore, userScore);
      updateBoxEl.style.display = "block";
    }

    nextBtn.addEventListener("click", () => {
      if (userAnswers[current] === null) {
        statusEl.textContent = `Please pick one option for Question ${current + 1}.`;
        return;
      }
      if (current === QUESTIONS.length - 1) {
        duel();
        return;
      }
      current += 1;
      render();
    });

    prevBtn.addEventListener("click", () => {
      if (current === 0) return;
      current -= 1;
      render();
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      current = 0;
      for (let i = 0; i < userAnswers.length; i += 1) userAnswers[i] = null;
      render();
    });

    copyUpdateBtn.addEventListener("click", async () => {
      if (!updateTextEl.value) return;
      try {
        await navigator.clipboard.writeText(updateTextEl.value);
        statusEl.textContent = "Persona update text copied to clipboard.";
      } catch (_) {
        statusEl.textContent = "Clipboard copy blocked by browser; use manual copy.";
      }
    });

    downloadUpdateBtn.addEventListener("click", () => {
      if (!updateTextEl.value) return;
      const blob = new Blob([updateTextEl.value], { type: "text/markdown;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `Persona_Update_Proposal_${new Date().toISOString().slice(0, 10)}.md`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(a.href);
      statusEl.textContent = "Downloaded Persona update proposal.";
    });

    render();
  </script>
</body>
</html>
